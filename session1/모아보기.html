<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>질문에서 결과물까지 · 1회차 · 모아보기</title>
  <link rel="stylesheet" href="css/base.css?v=20261007-prompter2">
  <link rel="stylesheet" href="css/deck.css?v=20261007-slide11c">
  <style>
    body.sheet { margin: 0; padding: 28px; background: var(--paper-2); }
    .sheet-head { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin: 0 0 18px; }
    .sheet-head h1 { margin: 0; font-size: 24px; font-weight: 780; letter-spacing: -.03em; }
    .sheet-head p { margin: 0; color: var(--muted); font-size: 14px; }
    #report { margin: 0 0 18px; padding: 14px 16px; border-radius: 10px; background: #fff; font: 13px/1.6 Consolas, "D2Coding", monospace; white-space: pre-wrap; }
    #report:empty { display: none; }
    #report.ok { border-left: 4px solid var(--accent); }
    #report.bad { border-left: 4px solid var(--signal); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
    .cell { margin: 0; border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 4px 14px rgba(20, 30, 25, .08); }
    .thumb { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; }
    .thumb .canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: top left; }
    .thumb .slide { display: block; }
    .cell > figcaption { display: flex; gap: 8px; padding: 9px 12px; font-size: 13px; color: var(--char); }
    .cell > figcaption b { color: var(--accent); font-variant-numeric: tabular-nums; }
    .cell.bad { box-shadow: 0 0 0 3px var(--signal); }
    .flag-text { outline: 2px solid var(--signal) !important; outline-offset: 1px; }
    body.check .grid { grid-template-columns: 1fr; max-width: 1280px; }
  </style>
</head>
<body class="sheet">
  <header class="sheet-head">
    <h1 id="deck-title">모아보기</h1>
    <p id="deck-sum"></p>
    <p>?check를 붙여 열면 글자 겹침 · 화면 밖 넘침 · 그림 누락을 점검합니다</p>
  </header>
  <pre id="report"></pre>
  <div class="grid" id="grid"></div>
  <script src="js/deck-data.js?v=20261007-slide11c"></script>
  <script src="js/slides.js?v=20261007-prompter2"></script>
  <script src="js/check.js?v=20261007-prompter2"></script>
</body>
</html>
